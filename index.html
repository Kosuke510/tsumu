<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TSUMU — どこまで積める？</title>
<meta name="description" content="タップで積むだけ。ズレたら削れる。どこまで高く積める？中毒系タワーゲーム">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e1a; touch-action:none; }
  body { font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; color:#fff; }
  canvas { position:fixed; inset:0; display:block; }

  #hudScore {
    position:fixed; top:6%; left:0; width:100%; text-align:center; z-index:5;
    font-size:min(19vw,76px); font-weight:800; letter-spacing:0.02em;
    text-shadow:0 4px 24px rgba(0,0,0,.45); pointer-events:none;
    transition:transform .12s;
  }
  #hudScore.pop { transform:scale(1.18); }
  #combo {
    position:fixed; top:calc(6% + min(20vw,84px)); left:0; width:100%; text-align:center; z-index:5;
    font-size:18px; font-weight:700; color:#ffe066; text-shadow:0 2px 12px rgba(0,0,0,.5);
    opacity:0; transition:opacity .4s; pointer-events:none;
  }
  #combo.show { opacity:1; }

  .ov {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:14px;
    background:rgba(5,8,18,.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:opacity .35s;
  }
  .ov.hidden { opacity:0; pointer-events:none; }
  #title h1 {
    font-size:min(22vw,96px); font-weight:800; letter-spacing:.18em; margin-left:.18em;
    background:linear-gradient(135deg,#7dd8ff,#c79bff 55%,#ff9bb8);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 6px 24px rgba(125,160,255,.35));
  }
  #title .sub { font-size:15px; color:#aab4d4; letter-spacing:.1em; }
  #title .tap { margin-top:34px; font-size:15px; color:#fff; letter-spacing:.25em; animation:blink 1.6s ease-in-out infinite; }
  #title .best { font-size:13px; color:#7d8ab0; }
  @keyframes blink { 0%,100%{opacity:.35} 50%{opacity:1} }

  .card {
    background:rgba(18,22,40,.92); border:1px solid rgba(140,160,220,.25);
    border-radius:22px; padding:30px 36px; box-shadow:0 18px 60px rgba(0,0,0,.5);
    display:flex; flex-direction:column; gap:10px; align-items:center; min-width:264px;
  }
  .card .lbl { font-size:13px; color:#8b96bb; letter-spacing:.2em; }
  .card .num { font-size:64px; font-weight:800; line-height:1.1; }
  .card .nb { color:#ffe066; font-size:14px; font-weight:700; }
  .card .bst { color:#8b96bb; font-size:14px; }
  .btns { display:flex; gap:10px; margin-top:14px; }
  button {
    font-family:inherit; font-size:16px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,#5b8cff,#7c5bff); border:none; border-radius:14px;
    padding:14px 22px; cursor:pointer; letter-spacing:.05em;
    box-shadow:0 6px 18px rgba(90,110,255,.35);
  }
  button.ghost { background:rgba(255,255,255,.1); box-shadow:none; }
  button:active { transform:scale(.96); }
  #mute {
    position:fixed; top:14px; right:14px; z-index:20; width:44px; height:44px; padding:0;
    border-radius:12px; background:rgba(255,255,255,.08); box-shadow:none; font-size:18px;
  }
  #toast {
    position:fixed; bottom:11%; left:50%; transform:translateX(-50%); z-index:30;
    background:rgba(18,22,40,.92); border:1px solid rgba(140,255,200,.4); color:#9fffd9;
    border-radius:12px; padding:9px 20px; font-size:13.5px; opacity:0; transition:opacity .3s; pointer-events:none;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudScore">0</div>
<div id="combo"></div>
<button id="mute">♪</button>

<div id="title" class="ov">
  <h1>TSUMU</h1>
  <div class="sub">タップで、積む。ただそれだけ。</div>
  <div class="tap">タップでスタート</div>
  <div class="best" id="titleBest"></div>
</div>

<div id="over" class="ov hidden">
  <div class="card">
    <div class="lbl">とうたつ階数</div>
    <div class="num" id="finalScore">0</div>
    <div class="nb hidden" id="newBest">🏆 ベスト更新！</div>
    <div class="bst" id="overBest"></div>
    <div class="btns">
      <button id="btnRetry">もう一回</button>
      <button id="btnShare" class="ghost">シェア</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================
   TSUMU — ワンタップ積み上げタワー
   (c) 2026 — MIT License
   ============================================ */
const $ = id => document.getElementById(id);

/* ---------- ストレージ（プライベートモード対策） ---------- */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* ---------- サウンド ---------- */
let AC = null, muted = lsGet('tsumu_mute', '0') === '1';
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(f, dur, type, gain, delay) {
  if (muted) return;
  const a = ac(); if (!a) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(gain || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfxDrop    = lv => { beep(110 + lv * 1.5, 0.09, 'square', 0.06); beep(65, 0.13, 'sine', 0.22); };
const sfxPerfect = cb => { const f = 330 * Math.pow(1.0595, Math.min(cb, 24)); beep(f, 0.15, 'sine', 0.2); beep(f * 1.5, 0.2, 'sine', 0.11, 0.07); };
const sfxOver    = () => { beep(230, 0.4, 'sawtooth', 0.09); beep(115, 0.6, 'sawtooth', 0.07, 0.16); };

/* ---------- キャンバス ---------- */
const cv = $('c'), ctx = cv.getContext('2d');
let DPR = 1, CW = 0, CH = 0, SCALE = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  /* iOS Safari はツールバーが被るため、実際に見えている領域を基準にする */
  const vv = window.visualViewport;
  CW = (vv && vv.width) || window.innerWidth;
  CH = (vv && vv.height) || window.innerHeight;
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
  cv.style.width = CW + 'px'; cv.style.height = CH + 'px';
  SCALE = Math.min(CW / 540, CH / 760, 1);
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

/* ---------- 定数 ---------- */
const BASE = 150;     // 初期ブロックサイズ
const H = 34;         // 1階の高さ
const AMP = 190;      // 移動振幅
const ISX = 0.866, ISY = 0.5;
const PERFECT = 9;    // ぴったり判定のゆるさ
const GRAV = 2400;

/* ---------- 状態 ---------- */
let state = 'title';  // title | play | over
let blocks = [], falls = [], parts = [];
let cur = null, level = 1, score = 0, combo = 0;
let best = parseInt(lsGet('tsumu_best', '0'), 10) || 0;
let camY = 0, targetCam = 0, zoom = 1, targetZoom = 1, shake = 0;
let hueBase = Math.random() * 360;
let t = 0, overAt = 0;

const hueFor = lv => (hueBase + lv * 5) % 360;

function reset() {
  blocks = [{ x: 0, z: 0, w: BASE, d: BASE, y: 0 }];
  falls = []; parts = [];
  level = 1; score = 0; combo = 0;
  camY = 0; targetCam = 0; zoom = 1; targetZoom = 1; t = 0;
  hueBase = Math.random() * 360;
  spawn();
  updateScoreUI(false);
}
function spawn() {
  const prev = blocks[blocks.length - 1];
  cur = {
    axis: level % 2 === 1 ? 'x' : 'z',
    w: prev.w, d: prev.d, y: level,
    phase: Math.random() < 0.5 ? 0 : Math.PI,
    speed: 1.9 + Math.min(level * 0.028, 1.7),
    cx: prev.x, cz: prev.z,
  };
}
function curPos() {
  const c = cur.axis === 'x' ? cur.cx : cur.cz;
  return c + Math.sin(t * cur.speed + cur.phase) * AMP;
}

/* ---------- 1タップの処理：重ねて、切る ---------- */
function drop() {
  const prev = blocks[blocks.length - 1];
  const a = cur.axis;
  const pos = curPos();
  const prevC = a === 'x' ? prev.x : prev.z;
  const size = a === 'x' ? cur.w : cur.d;
  const delta = pos - prevC;
  const overlap = size - Math.abs(delta);

  if (overlap <= 4) { gameOver(pos); return; }

  let nx = prev.x, nz = prev.z, nw = cur.w, nd = cur.d;

  if (Math.abs(delta) <= PERFECT) {
    /* ぴったり！ */
    combo++;
    sfxPerfect(combo);
    showCombo(combo);
    if (combo >= 2) { /* ご褒美：少し育つ */
      nw = Math.min(nw * 1.1, BASE);
      nd = Math.min(nd * 1.1, BASE);
    }
    ringAt(prev.x, prev.z, level * H + H, Math.max(nw, nd));
  } else {
    /* ズレた分を切り落とす */
    combo = 0; hideCombo();
    const newC = prevC + delta / 2;
    const cutSize = size - overlap;
    const cutC = newC + Math.sign(delta) * (overlap / 2 + cutSize / 2);
    falls.push({
      x: a === 'x' ? cutC : prev.x, z: a === 'z' ? cutC : prev.z,
      w: a === 'x' ? cutSize : nw, d: a === 'z' ? cutSize : nd,
      yw: level * H, vy: 0, hue: hueFor(level),
    });
    if (a === 'x') { nx = newC; nw = overlap; } else { nz = newC; nd = overlap; }
    sfxDrop(level);
    burstAt(cutC === undefined ? prev.x : (a === 'x' ? newC : prev.x), a === 'z' ? newC : prev.z, level * H + H);
    shake = 3;
  }

  blocks.push({ x: nx, z: nz, w: nw, d: nd, y: level });
  score = blocks.length - 1;
  level++;
  targetCam = (level - 1) * H;
  spawn();
  updateScoreUI(true);
}

function gameOver(pos) {
  /* 乗らなかったブロックは丸ごと落下 */
  falls.push({
    x: cur.axis === 'x' ? pos : cur.cx, z: cur.axis === 'z' ? pos : cur.cz,
    w: cur.w, d: cur.d, yw: level * H, vy: 0, hue: hueFor(level),
  });
  state = 'over'; overAt = performance.now();
  sfxOver(); shake = 6;
  /* タワー全体が見えるようにズームアウト */
  const towerH = level * H;
  targetZoom = Math.min(1, (CH * 0.52) / (towerH * SCALE + 1));
  targetCam = towerH * 0.45;
  const nb = score > best;
  if (nb) { best = score; lsSet('tsumu_best', String(best)); }
  $('finalScore').textContent = score;
  $('newBest').classList.toggle('hidden', !nb);
  $('overBest').textContent = 'ベスト: ' + best + ' 階';
  $('over').classList.remove('hidden');
}

function startGame() {
  $('title').classList.add('hidden');
  $('over').classList.add('hidden');
  reset();
  state = 'play';
}

/* ---------- 演出 ---------- */
function burstAt(x, z, yw) {
  for (let i = 0; i < 10; i++) {
    parts.push({ x, z, yw, sx: 0, sy: 0,
      vx: (Math.random() - 0.5) * 320, vy: -Math.random() * 260 - 60,
      life: 0.55 + Math.random() * 0.3, size: 3 + Math.random() * 4 });
  }
}
function ringAt(x, z, yw, sz) {
  parts.push({ x, z, yw, ring: true, r: sz * 0.55, life: 0.45, maxLife: 0.45 });
}
function updateScoreUI(pop) {
  const el = $('hudScore');
  el.textContent = score;
  if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}
let comboTimer = 0;
function showCombo(cb) {
  const el = $('combo');
  el.textContent = cb >= 2 ? `✨ PERFECT ×${cb}` : '✨ PERFECT';
  el.classList.add('show');
  clearTimeout(comboTimer);
  comboTimer = setTimeout(hideCombo, 1400);
}
function hideCombo() { $('combo').classList.remove('show'); }
function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ---------- 描画 ---------- */
function P(xx, zz, yy) { return [(xx - zz) * ISX, (xx + zz) * ISY - yy]; }
function face(p1, p2, p3, p4, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
  ctx.lineTo(p3[0], p3[1]); ctx.lineTo(p4[0], p4[1]);
  ctx.closePath(); ctx.fill();
}
function drawBox(x, z, w, d, yw, hue, lite) {
  const hw = w / 2, hd = d / 2, top = yw + H, bot = yw;
  const tA = P(x - hw, z - hd, top), tB = P(x + hw, z - hd, top),
        tC = P(x + hw, z + hd, top), tD = P(x - hw, z + hd, top);
  const bB = P(x + hw, z - hd, bot), bC = P(x + hw, z + hd, bot), bD = P(x - hw, z + hd, bot);
  const L = lite ? 10 : 0;
  face(tB, tC, bC, bB, `hsl(${hue},58%,${40 + L}%)`);   // 右面
  face(tD, tC, bC, bD, `hsl(${hue},58%,${51 + L}%)`);   // 左面
  face(tA, tB, tC, tD, `hsl(${hue},62%,${66 + L}%)`);   // 上面
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  /* 背景：高さでゆっくり色が変わる */
  const bh = hueFor(level);
  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, `hsl(${(bh + 160) % 360},38%,16%)`);
  g.addColorStop(1, `hsl(${(bh + 200) % 360},42%,7%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);

  ctx.save();
  const jx = (Math.random() - 0.5) * shake, jy = (Math.random() - 0.5) * shake;
  ctx.translate(CW / 2 + jx, CH * 0.60 + jy);
  ctx.scale(SCALE * zoom, SCALE * zoom);

  for (const b of blocks) drawBox(b.x, b.z, b.w, b.d, b.y * H - camY, hueFor(b.y));
  for (const f of falls) drawBox(f.x, f.z, f.w, f.d, f.yw - camY, f.hue);
  if (state === 'play' && cur) {
    const pos = curPos();
    drawBox(cur.axis === 'x' ? pos : cur.cx, cur.axis === 'z' ? pos : cur.cz,
            cur.w, cur.d, cur.y * H - camY, hueFor(cur.y), true);
  }
  /* パーティクル */
  for (const p of parts) {
    const [px0, py0] = P(p.x, p.z, p.yw - camY);
    if (p.ring) {
      const k = 1 - p.life / p.maxLife;
      ctx.strokeStyle = `rgba(255,235,130,${(1 - k) * 0.9})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px0, py0, p.r * (0.6 + k * 1.2), 0, 7);
      ctx.stroke();
    } else {
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, p.life * 2)})`;
      ctx.fillRect(px0 + p.sx - p.size / 2, py0 + p.sy - p.size / 2, p.size, p.size);
    }
  }
  ctx.restore();
}

/* ---------- メインループ ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (state === 'play') t += dt;

  camY += (targetCam - camY) * Math.min(1, dt * 5);
  zoom += (targetZoom - zoom) * Math.min(1, dt * 4);
  shake *= Math.pow(0.0005, dt);

  for (let i = falls.length - 1; i >= 0; i--) {
    const f = falls[i];
    f.vy += GRAV * dt; f.yw -= f.vy * dt;
    if (f.yw < camY - 1500) falls.splice(i, 1);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (!p.ring) { p.vy += 900 * dt; p.sx += p.vx * dt; p.sy += p.vy * dt; }
    if (p.life <= 0) parts.splice(i, 1);
  }

  render();
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function tap(e) {
  if (e && e.target && e.target.closest && e.target.closest('button')) return;
  ac();
  if (state === 'title') startGame();
  else if (state === 'play') drop();
  else if (state === 'over' && performance.now() - overAt > 700) startGame();
}
window.addEventListener('pointerdown', tap);
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tap(); } });

$('btnRetry').addEventListener('click', startGame);
$('btnShare').addEventListener('click', () => {
  const txt = `🏗 TSUMUで ${score}階 まで積み上げた！あなたは何階いける？`;
  const url = location.href.split('#')[0];
  if (navigator.share) {
    navigator.share({ title: 'TSUMU', text: txt, url }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(txt + ' ' + url).then(() => toast('結果をコピーしました📋'));
  }
});
function syncMute() { $('mute').textContent = muted ? '🔇' : '♪'; }
$('mute').addEventListener('click', () => { muted = !muted; lsSet('tsumu_mute', muted ? '1' : '0'); syncMute(); });
syncMute();

$('titleBest').textContent = best > 0 ? `ベスト: ${best} 階` : '';
requestAnimationFrame(frame);
</script>
</body>
</html>
